services:
  api:
    image: lead-triage:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: lead-triage:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command:
      - python
      - -m
      - app.jobs.classification_daemon
      - --worker-id
      - docker-worker-1
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 2m

  crm-sync-worker:
    image: lead-triage:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command:
      - python
      - -m
      - app.jobs.crm_sync_daemon
      - --worker-id
      - docker-crm-sync-worker-1
    env_file:
      - .env
    restart: always
    stop_grace_period: 2m
